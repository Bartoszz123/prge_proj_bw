x-environment:
  - &env-postgres-db POSTGRES_DB=${POSTGRES_DB}
  - &env-postgres-user POSTGRES_USER=${POSTGRES_USER}
  - &env-postgres-password POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  - &env-geoserver-user GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
  - &env-geoserver-password GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
  - &env-postgres-port POSTGRES_PORT=${POSTGRES_PORT}

services:
  postgis:
    build:
      context: ..
      dockerfile: docker/postgis/Dockerfile
    image: 'postgis_prge'
    container_name: "postgis_prge_${ENV_NAME}"
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgis-data:/var/lib/postgresql/data

  geoserver:
    build:
      context: ..
      dockerfile: docker/geoserver/Dockerfile
    image: 'geoserver_prge'
    container_name: 'geoserver_prge_${ENV_NAME}'
    environment:
     - SKIP_DEMO_DATA=true
     - *env-postgres-db
     - *env-postgres-user
     - *env-postgres-password
     - *env-geoserver-password
     - *env-geoserver-user
    ports:
      - ${GEOSERVER_PORT}:8080
    volumes:
      - geoserver_data:/opt/geoserver_data


  fastapi:
    build:
      context: ..
      dockerfile: docker/fastapi/Dockerfile
    image: 'fastapi_prge'
    container_name: 'fastapi_prge_${ENV_NAME}'
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
      - *env-postgres-port
    ports:
      - ${FASTAPI_PORT}:10000


volumes:
  postgis-data:
  geoserver_data: